openapi: 3.1.0
info:
  title: Norns API
  description: REST API for the Norns durable agent runtime.
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4000/api/v1
    description: Local development
  - url: https://norns-runtime.fly.dev/api/v1
    description: Fly.io deployment

security:
  - bearerAuth: []

paths:
  /agents:
    get:
      operationId: listAgents
      summary: List agents
      tags: [Agents]
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"

    post:
      operationId: createAgent
      summary: Create agent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Agent"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agents/{id}:
    get:
      operationId: getAgent
      summary: Show agent
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Agent details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: updateAgent
      summary: Update agent
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
      responses:
        "200":
          description: Agent updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /agents/{agent_id}/messages:
    post:
      operationId: sendMessage
      summary: Send message to agent
      description: Starts a new run. Returns immediately with a run ID.
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentIdNested"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: Message content
                conversation_key:
                  type: string
                  description: Key for multi-turn conversations
      responses:
        "202":
          description: Message accepted, run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
                  run_id:
                    type: integer
        "409":
          description: Agent is busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Missing content field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /agents/{agent_id}/status:
    get:
      operationId: getAgentStatus
      summary: Get agent process status
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentIdNested"
      responses:
        "200":
          description: Agent process state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [idle, running, awaiting_llm, awaiting_tools, waiting_timer, stopped]
                      agent_id:
                        type: integer
                      run_id:
                        type: integer
                        nullable: true
                      step:
                        type: integer
                      conversation_id:
                        type: integer
                        nullable: true
                      conversation_key:
                        type: string
                      message_count:
                        type: integer
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agent_id}/runs:
    get:
      operationId: listAgentRuns
      summary: List runs for an agent
      tags: [Runs]
      parameters:
        - $ref: "#/components/parameters/AgentIdNested"
      responses:
        "200":
          description: List of runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agent_id}/conversations:
    get:
      operationId: listConversations
      summary: List conversations for an agent
      tags: [Conversations]
      parameters:
        - $ref: "#/components/parameters/AgentIdNested"
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agent_id}/conversations/{key}:
    get:
      operationId: getConversation
      summary: Get a conversation by key
      tags: [Conversations]
      parameters:
        - $ref: "#/components/parameters/AgentIdNested"
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Conversation"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: deleteConversation
      summary: Delete a conversation (reset)
      tags: [Conversations]
      parameters:
        - $ref: "#/components/parameters/AgentIdNested"
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /runs:
    get:
      operationId: listRuns
      summary: List runs across all agents
      tags: [Runs]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Run"

  /runs/{id}:
    get:
      operationId: getRun
      summary: Show run details
      tags: [Runs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Run details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Run"
        "404":
          $ref: "#/components/responses/NotFound"

  /runs/{id}/retry:
    post:
      operationId: retryRun
      summary: Retry a failed run with the same input
      tags: [Runs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Retry accepted, new run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
                  run_id:
                    type: integer
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Run still in progress or agent is busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Run has no user_message to retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs/{id}/events:
    get:
      operationId: listRunEvents
      summary: Get event log for a run
      tags: [Runs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Event log
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunEvent"
        "404":
          $ref: "#/components/responses/NotFound"

  /workers:
    get:
      operationId: listWorkers
      summary: List connected workers
      description: >-
        Workers currently holding a connection for this tenant, **to the
        node that serves this request**. `Norns.Workers.WorkerRegistry`
        keeps its connected-worker map in one node-local GenServer, so a
        deployment with more than one node connected returns a different,
        partial list from each node rather than a single cluster-wide
        view. This is not a scoping choice: clustering (Horde, libcluster)
        is unbuilt — see nornscode/norns#17 and the "Multi-node / Horde
        clustering" entry in
        https://github.com/nornscode/norns/blob/main/docs/roadmap.md.
        `Norns.Workers.TaskQueue` has the identical node-local shape. The
        deployed app is currently held at one machine by operator action
        (`fly scale count 1`) as a rail against this until clustering
        lands.
      tags: [Workers]
      responses:
        "200":
          description: Connected workers for this tenant, on this node
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Worker"

  /serverless_workers:
    get:
      operationId: listServerlessWorkers
      summary: List serverless workers
      description: >-
        Workers declared with a wake URL instead of a standing connection.
        Their declared tools are offered to agents while they sleep; a task
        for one wakes it. See docs/serverless-workers.md for the wake
        contract. `awake` says whether an incarnation is connected now.
      tags: [Workers]
      responses:
        "200":
          description: Serverless workers for this tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServerlessWorker"
    post:
      operationId: createServerlessWorker
      summary: Declare a serverless worker
      description: >-
        The response carries the signing `secret` — this is the only time
        it is shown. Give it to the worker; every wake is signed with it.
      tags: [Workers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, wake_url]
              properties:
                worker_id:
                  type: string
                  description: The id the worker joins the channel with.
                wake_url:
                  type: string
                  format: uri
                tools:
                  type: array
                  items:
                    type: object
                    required: [name, description, input_schema]
                capabilities:
                  type: array
                  items:
                    type: string
                    enum: [llm, tools]
                  default: [tools]
                enabled:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Created, with the one-time secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/ServerlessWorker"
                      - type: object
                        properties:
                          secret:
                            type: string
        "422":
          description: Validation error

  /serverless_workers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getServerlessWorker
      summary: Get a serverless worker
      tags: [Workers]
      responses:
        "200":
          description: The worker
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ServerlessWorker"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateServerlessWorker
      summary: Update a serverless worker
      description: >-
        `enabled: false` withdraws its tools without deleting the record.
        `worker_id` and `secret` cannot be changed.
      tags: [Workers]
      responses:
        "200":
          description: The updated worker
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
    delete:
      operationId: deleteServerlessWorker
      summary: Delete a serverless worker
      tags: [Workers]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /serverless_workers/{id}/wake:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: wakeServerlessWorker
      summary: Send a wake now
      description: >-
        Outside dispatch, for checking a deployment end to end: the worker
        should appear in `GET /workers` shortly after.
      tags: [Workers]
      responses:
        "202":
          description: Wake sent
        "404":
          $ref: "#/components/responses/NotFound"

  /run_webhooks:
    get:
      operationId: listRunWebhooks
      summary: List run webhooks
      description: >-
        URLs Norns POSTs a signed event to when a run parks on a question,
        completes, or fails. See docs/run-webhooks.md for the delivery
        contract.
      tags: [Runs]
      responses:
        "200":
          description: Run webhooks for this tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunWebhook"
    post:
      operationId: createRunWebhook
      summary: Create a run webhook
      description: >-
        The response carries the signing `secret` — this is the only time
        it is shown. Give it to the receiver; every delivery is signed
        with it.
      tags: [Runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                    enum: [run.waiting, run.completed, run.failed]
                  default: [run.waiting, run.completed, run.failed]
                enabled:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Created, with the one-time secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/RunWebhook"
                      - type: object
                        properties:
                          secret:
                            type: string
        "422":
          description: Validation error

  /run_webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getRunWebhook
      summary: Get a run webhook
      tags: [Runs]
      responses:
        "200":
          description: The run webhook
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RunWebhook"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRunWebhook
      summary: Update a run webhook
      description: Change the URL or events, or set `enabled` false to silence it without deleting it.
      tags: [Runs]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                    enum: [run.waiting, run.completed, run.failed]
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Validation error
    delete:
      operationId: deleteRunWebhook
      summary: Delete a run webhook
      tags: [Runs]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /run_webhooks/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: testRunWebhook
      summary: Deliver a sample event now
      description: >-
        Synchronous, for checking a receiver end to end. Sends a
        `run.test` event and reports what the receiver answered.
      tags: [Runs]
      responses:
        "200":
          description: Delivered; the receiver answered 2xx
        "502":
          description: The receiver rejected it or was unreachable; the body says which
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Tenant API key (e.g. nrn_...)

  parameters:
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    AgentIdNested:
      name: agent_id
      in: path
      required: true
      schema:
        type: integer

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string

    Agent:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        purpose:
          type: string
          nullable: true
        status:
          type: string
        system_prompt:
          type: string
        model:
          type: string
          nullable: true
        mode:
          type: string
          enum: [task, conversation]
        context_strategy:
          type: string
          enum: [sliding_window, none]
        context_window:
          type: integer
        max_steps:
          type: integer
          nullable: true
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentCreate:
      type: object
      required: [name, system_prompt, status]
      properties:
        name:
          type: string
        purpose:
          type: string
        status:
          type: string
        system_prompt:
          type: string
        model:
          type: string
        max_steps:
          type: integer
        model_config:
          type: object
          properties:
            mode:
              type: string
              enum: [task, conversation]
            checkpoint_policy:
              type: string
              enum: [every_step, on_tool_call, manual]
            context_strategy:
              type: string
              enum: [sliding_window, none]
            context_window:
              type: integer
            on_failure:
              type: string
              enum: [retry_last_step, fail]

    Run:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: integer
        conversation_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [pending, running, completed, failed]
        trigger_type:
          type: string
        input:
          type: object
        output:
          type: string
          nullable: true
        failure_metadata:
          type: object
        failure_inspector:
          type: object
          nullable: true
          properties:
            error_class:
              type: string
            error_code:
              type: string
            retry_decision:
              type: string
            last_checkpoint:
              type: object
              nullable: true
            last_event:
              type: object
              nullable: true
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RunEvent:
      type: object
      properties:
        id:
          type: integer
        sequence:
          type: integer
        event_type:
          type: string
          enum:
            - run_started
            - llm_request
            - llm_response
            - tool_call
            - tool_result
            - tool_duplicate
            - subagent_launched
            - waiting_for_timer
            - checkpoint_saved
            - retry
            - run_completed
            - run_failed
        payload:
          type: object
        source:
          type: string
        inserted_at:
          type: string
          format: date-time

    Conversation:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: integer
        key:
          type: string
        summary:
          type: string
          nullable: true
        message_count:
          type: integer
        token_estimate:
          type: integer
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Worker:
      type: object
      description: >-
        A worker connection held by this node's WorkerRegistry. Scoped to
        the node that answered the request — see the description on
        `GET /workers`.
      properties:
        worker_id:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum: [llm, tools]
        tool_count:
          type: integer
        gard:
          type: integer
          nullable: true
        draining:
          type: boolean
        serverless:
          type: boolean
          description: This connection is the woken incarnation of a declared serverless worker.

    RunWebhook:
      type: object
      description: A URL that hears about run state changes. See docs/run-webhooks.md.
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum: [run.waiting, run.completed, run.failed]
        enabled:
          type: boolean
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServerlessWorker:
      type: object
      description: A worker declared with a wake URL. See docs/serverless-workers.md.
      properties:
        id:
          type: integer
        worker_id:
          type: string
        wake_url:
          type: string
          format: uri
        tools:
          type: array
          items:
            type: object
        capabilities:
          type: array
          items:
            type: string
            enum: [llm, tools]
        enabled:
          type: boolean
        awake:
          type: boolean
          description: An incarnation is connected right now.
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
